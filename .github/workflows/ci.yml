name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: welldata
          POSTGRES_PASSWORD: welldata
          POSTGRES_DB: welldata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U welldata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://welldata:welldata@localhost:5432/welldata
      REQUIRE_DB: "1"  # database tests fail instead of skipping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -v
