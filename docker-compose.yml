services:
  db:
    image: postgis/postgis:16-3.4
    # Pinned to amd64 so the same image runs on Apple Silicon (Docker Desktop emulates it).
    platform: linux/amd64
    environment:
      POSTGRES_USER: welldata
      POSTGRES_PASSWORD: welldata
      POSTGRES_DB: welldata
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
