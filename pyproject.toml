[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "welldata"
version = "0.1.0"
description = "Question-answering assistant over Oklahoma water-well records"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pandera>=0.24",
    "psycopg[binary]>=3.2",
    "geographiclib>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
welldata = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a PostGIS database (set DATABASE_URL)"]
